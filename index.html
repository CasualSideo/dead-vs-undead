<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead v. Undead</title>
<style>
:root{--red:#e6e0c8;--blue:#79d24f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0f14;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none}
canvas{display:block;filter:saturate(1.18) contrast(1.06)}
#hud::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,#0a123066 100%)}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000a}
#score{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:baseline;font-size:34px}
#score i{font-style:normal;font-size:13px;opacity:.75;font-weight:400}
.r{color:var(--red)}.b{color:var(--blue)}
#xh{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fffc;border-radius:50%}
#hm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;opacity:0}
#bl{position:absolute;left:24px;bottom:22px;font-size:15px}
#bar{width:230px;height:10px;background:#0007;border-radius:5px;overflow:hidden;margin:6px 0}
#hp{height:100%;width:100%;background:#4ade80;transition:width .1s}
#ammo{position:absolute;right:28px;bottom:22px;font-size:40px}
#ammo small{font-size:16px;opacity:.7;font-weight:400}
#feed{position:absolute;right:16px;top:14px;text-align:right;font-size:14px;line-height:1.7}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px #f00;opacity:0}
#dead{position:absolute;top:62%;width:100%;text-align:center;font-size:22px;display:none}
.ov{overflow:auto;position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(ellipse at center,#1a2132cc,#05070bf0)}
.hide{display:none!important}
h1{margin:0;font-size:clamp(40px,9vw,92px);line-height:1;letter-spacing:.01em}
h1 span{font-size:.38em;opacity:.55;margin:0 .35em;font-weight:400}
.ov p{margin:0;opacity:.8;max-width:480px;line-height:1.5}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-weight:700;font-size:19px;padding:15px 36px;border:0;border-radius:6px;color:#fff;cursor:pointer}
button.r{background:var(--red);color:#161616}button.b{background:var(--blue);color:#101810}button.w{background:#fff;color:#111}
button:hover{filter:brightness(1.15)}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.step{display:flex;flex-direction:column;align-items:center;gap:18px}
button.m{background:#ffffff14;border:1px solid #fff5;text-align:left;min-width:250px;max-width:290px;padding:16px 24px}
button.m small{display:block;font-weight:400;font-size:13px;opacity:.75;margin-top:5px;line-height:1.4}
button.t{background:none;padding:6px;font-size:14px;font-weight:400;opacity:.7;text-decoration:underline}
:is(#nm,#jc){font:inherit;font-size:18px;font-weight:700;text-align:center;color:#fff;background:#ffffff14;border:1px solid #fff5;border-radius:6px;padding:11px 16px;width:250px;outline:none}
:is(#nm,#jc):focus{border-color:#fff;background:#ffffff22}:is(#nm,#jc)::placeholder{font-weight:400;opacity:.5}
:is(#lb,#lb2) table{border-collapse:collapse;font-size:15px;min-width:360px}
:is(#lb,#lb2) th{font-weight:400;opacity:.6;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:4px 14px}
:is(#lb,#lb2) td{padding:5px 14px;text-align:right}
:is(#lb,#lb2) th:nth-child(2),:is(#lb,#lb2) td:nth-child(2){text-align:left}:is(#lb,#lb2) td:first-child{opacity:.6}
:is(#lb,#lb2) tr.red td:nth-child(2){color:var(--red)}:is(#lb,#lb2) tr.blue td:nth-child(2){color:var(--blue)}
:is(#lb,#lb2) tr.me{background:#ffffff1f;font-weight:700}
#safe{position:absolute;top:92px;left:50%;transform:translateX(-50%);font-size:15px;white-space:nowrap;color:#9fe7b4}
#maps{max-width:980px}#maps button{min-width:190px;max-width:210px;padding:14px 18px}
#abil{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font-size:16px}
#carry{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-size:15px;white-space:nowrap}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 33vmin,#000 33.3vmin)}
#scope::before,#scope::after{content:"";position:absolute;background:#000b}
#scope::before{left:0;right:0;top:50%;height:2px}#scope::after{top:0;bottom:0;left:50%;width:2px}
#hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-size:15px;color:#ffe08a}
#tab{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0b1020d9;border-radius:10px;padding:18px 26px;min-width:420px}
</style>
</head>
<body>
<div id="hud">
  <div id="score"><b class="r" id="sr">0</b><i id="goal">first to 25 kills</i><b class="b" id="sb">0</b></div>
  <div id="hint"></div><div id="scope"></div><div id="abil"></div><div id="carry"></div><div id="safe"></div>
  <div id="xh"></div><div id="hm">✕</div>
  <div id="feed"></div><div id="tab" class="hide"><div id="lb2"></div></div>
  <div id="bl"><div>Health <span id="hpn">100</span></div><div id="bar"><div id="hp"></div></div><div id="kd" style="font-weight:400;opacity:.8"></div></div>
  <div id="ammo"><small id="wn" style="display:block;text-align:right"></small><span id="am">15</span><small id="mag"> / 15</small></div>
  <div id="vig"></div>
  <div id="dead"></div>
</div>

<div id="party" class="hide" style="position:fixed;top:8px;left:10px;z-index:9;font-size:13px;font-weight:700;opacity:.85;text-shadow:0 1px 3px #000"></div>
<div id="menu" class="ov">
  <h1><span class="r">Dead</span><span>v.</span><span class="b" style="font-size:inherit;opacity:1;margin:0;font-weight:inherit">Undead</span></h1>
  <input id="nm" maxlength="14" placeholder="Your name" autocomplete="off" spellcheck="false">
  <div id="modeStep" class="step">
    <p>Five-on-five. Bots fill any slot a friend doesn't. Choose how the match is won.</p>
    <div class="row">
      <button class="m" onclick="pick('dm')">Team deathmatch<small>First team to 25 kills wins.</small></button>
      <button class="m" onclick="pick('ctf')">Capture the flag<small>Steal the enemy flag and carry it into your base. First to 3 captures wins.</small></button>
    </div>
    <div class="row"><button class="t" id="pt" onclick="togParty()">Private party: off</button><button class="t" onclick="joinUI()">Join a party with a code</button></div>
  </div>
  <div id="joinStep" class="step hide"><p>Enter the party code your host shared.</p><input id="jc" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false"><div class="row"><button class="w" onclick="joinParty()">Join</button></div><p id="jerr" style="color:#ffe08a;min-height:1.2em"></p><button class="t" onclick="showStep('modeStep')">Back</button></div>
  <div id="mapStep" class="step hide">
    <p>Choose a map, or let fate decide.</p>
    <div class="row" id="maps"></div>
    <button class="t" onclick="pick(null)">Change mode</button>
  </div>
  <div id="classStep" class="step hide">
    <p>Choose your class.</p>
    <div class="row" id="classes"></div>
    <button class="t" onclick="showStep(net.cl?'joinStep':'mapStep')">Change map</button>
  </div>
  <div id="teamStep" class="step hide">
    <p id="modeDesc"></p>
    <div class="row"><button class="r" onclick="start('red')">Join the Dead</button><button class="b" onclick="start('blue')">Join the Undead</button></div>
    <button class="t" onclick="showStep('classStep')">Change class</button>
  </div>
</div>
<div id="pause" class="ov hide"><h1 style="font-size:clamp(32px,6vw,56px)">Paused</h1><p id="pnote"></p><div class="row" id="pcls"></div><button class="w">Click to resume</button></div>
<div id="end" class="ov hide"><h1 id="endt"></h1><p id="ends"></p><div id="lb"></div><button class="w" onclick="location.reload()">Play again</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ---- Tuning ----
const CAP_WIN=3, FLAG_RETURN=15; // CTF: captures to win, seconds before a dropped flag returns itself
const MEDKIT_HEAL=50, MEDKIT_RESPAWN=120; // health restored; seconds until respawn (kit spots are set per map)
const GRACE=3; // seconds of invincibility after leaving your own zone
const TEAM_SIZE=5, WIN_SCORE=25, EYE=1.7, BOT_DMG=18, BOT_SPEED=5.2, RESPAWN=3;
// Weapons. Rifle does ~30% less damage than the pistol (26 vs 34) but fires faster and holds the trigger down.
const WDEF={
  glock:{id:'glock',name:'Glock 19',dmg:34,rate:.3,mag:15,reload:1.3,auto:false,spread:1,kz:.08,kr:.12},
  glockS:{id:'glock',name:'Glock 19',dmg:34*.95,rate:.3,mag:15,reload:1.3,auto:false,spread:1,kz:.08,kr:.12}, // stealth: 10% weaker
  ak:{id:'ak',name:'AK-47',dmg:26,rate:.18,mag:30,reload:1.8,auto:true,spread:1.4,kz:.05,kr:.06},
  rocket:{id:'rocket',name:'Rocket launcher',dmg:0,rate:1.25,mag:4,reload:2.6,auto:false,spread:.3,rocket:true,kz:.12,kr:.22},
  heal:{id:'heal',name:'Heal gun',beam:true,mag:0,rate:0,reload:0,kz:0,kr:0},
  mini:{id:'mini',name:'Minigun',dmg:8,rate:.06,mag:180,reload:4.5,auto:true,spread:2.2,kz:.03,kr:.03},
  sniper:{id:'sniper',name:'Sniper rifle',dmg:50,head:999,rate:2,mag:4,reload:2.5,auto:false,spread:.25,sniper:true,kz:.14,kr:.25}
};
const ROCKET_SPEED=38, ROCKET_R=5, ROCKET_DMG=90, HEAL_RATE=22, UBER_TIME=6, HEAL_RANGE=25, STEALTH_TIME=10, STEALTH_CD=10;
const CLASSES={
  soldier:{name:'Private',desc:'Glock 19 plus a fast AK-47. Well rounded.',weapons:['glock','ak']},
  stealth:{name:'Agent',desc:'Glock 19 only, 5% weaker. Press E to turn invisible for 10 seconds.',weapons:['glockS']},
  boom:{name:'BOOM',desc:'Glock 19 plus a rocket launcher with big splash damage.',weapons:['glock','rocket']},
  medic:{name:'Medic',desc:'Medigun: hold fire on a teammate to latch on and heal 22 HP/s. Healing builds an ÜberCharge: press E for 6 seconds of invulnerability for you and your patient. Plus the AK-47.',weapons:['heal','ak']},
  behemoth:{name:'Behemoth',desc:'Heavy gunner with a minigun: 180 rounds and huge firepower, but slower on your feet and it needs a moment to spin up.',weapons:['mini']},
  sniper:{name:'Sniper',desc:'Sniper rifle only. Headshot is an instant kill, body shot is half health. 2 seconds between shots. Hold right-click to scope.',weapons:['sniper']}
};
const COL={red:0xe6e0c8,blue:0x79d24f}, NAME={red:'Dead',blue:'Undead'}, BOTN={red:'Skeleton',blue:'Zombie'};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let myName='You';
try{$('nm').value=localStorage.getItem('rvb-name')||'';}catch(e){}

// ---- Renderer / scene ----
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b16);scene.fog=new THREE.Fog(0x070b16,18,80);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);camera.rotation.order='YXZ';scene.add(camera);
scene.add(new THREE.HemisphereLight(0x7088c8,0x141a26,.6));
const sun=new THREE.DirectionalLight(0x9fb4ff,.4);sun.position.set(20,40,10);scene.add(sun);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;sun.shadow.radius=3;
Object.assign(sun.shadow.camera,{left:-58,right:58,top:58,bottom:-58,near:5,far:140});

// first-person guns: solid grey, simple boxes. Glock 19 pistol and AK-47 rifle
const gun=new THREE.Group();gun.position.set(.2,-.2,-.5);gun.visible=false;camera.add(gun);
const gm=c=>new THREE.MeshLambertMaterial({color:c,transparent:true});
const G={light:gm(0x8a9097),mid:gm(0x6c7178),dark:gm(0x4a4e54),black:gm(0x2f3237)};
const pistol=new THREE.Group(),rifle=new THREE.Group();gun.add(pistol,rifle);rifle.position.set(0,.02,-.12);rifle.visible=false;
const flashMat=new THREE.MeshBasicMaterial({color:0xffd27a});
function part(g,w,h,d,x,y,z,mat,rx){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;g.add(m);return m;}
// Glock 19
{const p=(...a)=>part(pistol,...a);
  p(.065,.075,.34,0,.02,0,G.light);                 // slide
  for(const z of [.08,.1,.12])p(.067,.06,.008,0,.02,z,G.dark); // rear serrations
  p(.03,.03,.02,0,.02,-.175,G.black);               // barrel tip
  p(.058,.04,.28,0,-.03,.02,G.mid);                 // frame
  p(.04,.012,.1,0,-.075,-.02,G.mid);                // trigger guard
  p(.04,.05,.012,0,-.05,-.07,G.mid);
  p(.014,.035,.012,0,-.052,-.005,G.black);          // trigger
  p(.06,.17,.085,0,-.12,.12,G.mid,-.3);             // grip, raked back
  p(.066,.014,.092,0,-.205,.145,G.dark,-.3);        // magazine base
  p(.025,.014,.02,0,.0645,.15,G.black);             // rear sight
  p(.012,.014,.014,0,.0645,-.15,G.black);           // front sight
}
const flashP=part(pistol,.07,.07,.03,0,.02,-.2,flashMat);flashP.visible=false;
// AK-47
{const p=(...a)=>part(rifle,...a);
  p(.06,.075,.3,0,0,.05,G.mid);                     // receiver
  p(.056,.02,.3,0,.047,.05,G.light);                // dust cover
  p(.025,.025,.42,0,.02,-.3,G.black);               // barrel
  p(.03,.02,.26,0,.058,-.28,G.black);               // gas tube
  p(.058,.05,.2,0,.005,-.2,G.dark);                 // handguard
  p(.03,.04,.03,0,.04,-.38,G.black);                // gas block
  p(.026,.045,.026,0,.04,-.47,G.black);             // front sight base
  p(.01,.03,.01,0,.075,-.47,G.black);               // front sight post
  p(.036,.036,.045,0,.02,-.53,G.black);             // muzzle brake
  p(.05,.13,.07,0,-.1,.16,G.dark,-.35);             // pistol grip
  p(.03,.012,.1,0,-.06,.08,G.mid);                  // trigger guard
  p(.012,.03,.01,0,-.045,.075,G.black);             // trigger
  p(.045,.08,.14,0,-.02,.27,G.dark);                // stock
  p(.05,.1,.015,0,-.035,.347,G.dark);               // butt plate
  p(.05,.1,.065,0,-.09,0,G.mid,.1);                 // curved magazine, three segments
  p(.05,.1,.065,0,-.185,-.02,G.mid,.3);
  p(.05,.09,.065,0,-.27,-.06,G.mid,.5);
}
const flashR=part(rifle,.08,.08,.03,0,.02,-.58,flashMat);flashR.visible=false;
// Rocket launcher
const launcher=new THREE.Group(),healer=new THREE.Group();gun.add(launcher,healer);launcher.visible=healer.visible=false;launcher.position.set(0,.02,.02);
const orange=new THREE.MeshBasicMaterial({color:0xff8a3d}),healMat=new THREE.MeshBasicMaterial({color:0x4ade80}),white=new THREE.MeshBasicMaterial({color:0xf4f4f4});
{const p=(...a)=>part(launcher,...a);
  p(.09,.09,.7,0,.02,-.1,G.mid);p(.115,.115,.06,0,.02,-.43,G.dark);p(.115,.115,.08,0,.02,.2,G.dark);p(.06,.06,.05,0,.02,-.47,orange);
  p(.05,.13,.06,0,-.07,.05,G.black,-.2);p(.05,.04,.1,0,-.035,0,G.dark);p(.04,.015,.3,0,.07,-.05,G.light);p(.02,.05,.05,0,.095,-.1,G.black);
}
const flashB=part(launcher,.12,.12,.04,0,.02,-.5,flashMat);flashB.visible=false;
// Heal gun: Glock-shaped with a green emitter and a white cross
{const p=(...a)=>part(healer,...a);
  p(.07,.08,.28,0,.02,0,G.light);p(.05,.05,.1,0,.02,-.19,G.dark);p(.058,.04,.24,0,-.03,.02,G.mid);p(.05,.04,.16,0,.075,.02,G.mid);
  p(.076,.05,.012,0,.02,.06,white);p(.076,.012,.05,0,.02,.06,white);
  p(.04,.012,.1,0,-.075,-.02,G.mid);p(.04,.05,.012,0,-.05,-.07,G.mid);p(.014,.035,.012,0,-.052,-.005,G.black);
  p(.06,.17,.085,0,-.12,.12,G.mid,-.3);p(.066,.014,.092,0,-.205,.145,G.dark,-.3);
}
const healTip=part(healer,.035,.035,.03,0,.02,-.25,healMat);
const sniperG=new THREE.Group();gun.add(sniperG);sniperG.visible=false;sniperG.position.set(0,.02,-.1);
{const p=(...a)=>part(sniperG,...a);
  p(.055,.08,.32,0,0,.02,G.mid);p(.05,.05,.3,0,-.01,-.26,G.dark);p(.024,.024,.5,0,.015,-.6,G.black);p(.036,.036,.07,0,.015,-.88,G.black);
  p(.05,.09,.3,0,-.03,.34,G.dark);p(.052,.1,.015,0,-.03,.5,G.black);p(.045,.11,.06,0,-.09,.2,G.dark,-.3);p(.04,.07,.08,0,-.075,.03,G.mid);
  p(.06,.02,.025,.05,.02,.1,G.black);p(.025,.025,.025,.085,.02,.1,G.black); // bolt handle
  p(.04,.04,.28,0,.075,-.02,G.black);p(.055,.055,.06,0,.075,-.17,G.black);p(.05,.05,.05,0,.075,.13,G.black); // scope
}
const flashS=part(sniperG,.09,.09,.03,0,.015,-.93,flashMat);flashS.visible=false;
const miniG=new THREE.Group(),miniB=new THREE.Group();gun.add(miniG);miniG.visible=false;miniG.position.set(-.02,.02,.05);
{const p=(...a)=>part(miniG,...a);
  p(.14,.14,.3,0,0,.05,G.dark);p(.16,.16,.05,0,0,-.12,G.mid);p(.05,.14,.06,0,-.12,.08,G.black,-.2);p(.17,.14,.2,.14,-.08,.15,G.mid);p(.1,.03,.1,0,.09,.05,G.light);
  miniG.add(miniB);miniB.position.set(0,0,0);
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;part(miniB,.02,.02,.6,Math.cos(a)*.04,Math.sin(a)*.04,-.45,G.black);}
  part(miniB,.12,.12,.03,0,0,-.5,G.mid);part(miniB,.12,.12,.03,0,0,-.74,G.mid);
}
const flashM=part(miniG,.1,.1,.03,0,0,-.8,flashMat);flashM.visible=false;
const models={mini:miniG,glock:pistol,ak:rifle,rocket:launcher,heal:healer,sniper:sniperG},flashes={mini:flashM,glock:flashP,ak:flashR,rocket:flashB,sniper:flashS};

// ---- Map ----
const solids=[],boxes=[],ladders=[];let mapObjs=[],curKits=[];
const track=m=>{if(m.isMesh)m.castShadow=m.receiveShadow=true;scene.add(m);mapObjs.push(m);return m;};
function clearMap(){for(const m of mapObjs)scene.remove(m);mapObjs=[];solids.length=0;boxes.length=0;ladders.length=0;}
function floorTex(paint,rep){
  const c=document.createElement('canvas');c.width=c.height=64;paint(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);return t;
}
const SAT=.8; // map color saturation (1 = full color, lower = more muted)
function tone(c){const k=new THREE.Color(c),h={};k.getHSL(h);return k.setHSL(h.h,h.s*SAT,h.l);}
const lam=c=>new THREE.MeshLambertMaterial({color:tone(c)});
function addBox(x,z,w,d,h,col){ // solid: blocks movement and shots
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),lam(col));
  m.position.set(x,h/2,z);track(m);solids.push(m);
  boxes.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,h});
}
function glow(w,h,d,x,y,z,col){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:col}));m.position.set(x,y,z);return track(m);}
function addBoxY(x,z,w,d,y0,y1,col){ // solid slab from y0 to y1 (you can walk under it)
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,y1-y0,d),lam(col));
  m.position.set(x,(y0+y1)/2,z);track(m);solids.push(m);
  boxes.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,h:y1,y0});
}
// Enclosed, lit bases: two gates, a ladder up to an open roof deck, and a hole in the deck to drop back in
function buildBase(low){
  for(const s of [1,-1]){
    const tm=s>0?0xb5ad92:0x4f8f35,nc=s>0?0xe6e0c8:0xa8e07f,wz=s*28.7,roof=0xaab2c0;
    for(const [a,b] of [[-20.6,-14],[-6,6],[14,20.6]])addBox((a+b)/2,wz,b-a,.6,5.6,tm);
    for(const gx of [-10,10]){addBoxY(gx,wz,8,.6,4,5.6,tm);glow(7.4,.1,.12,gx,3.88,wz,nc);}

function resolve(e){
  for(const b of boxes){
    if(e.y>=b.h-.01||(b.y0&&e.y+1.9<=b.y0))continue;
    const cx=Math.max(b.minX,Math.min(e.x,b.maxX)),cz=Math.max(b.minZ,Math.min(e.z,b.maxZ));
    const dx=e.x-cx,dz=e.z-cz,d2=dx*dx+dz*dz;
    if(d2>=e.r*e.r)continue;
    if(d2>1e-8){const d=Math.sqrt(d2),p=e.r-d;e.x+=dx/d*p;e.z+=dz/d*p;}
    else{
      const l=e.x-b.minX,r=b.maxX-e.x,t=e.z-b.minZ,u=b.maxZ-e.z,m=Math.min(l,r,t,u);
      if(m===l)e.x=b.minX-e.r;else if(m===r)e.x=b.maxX+e.r;else if(m===t)e.z=b.minZ-e.r;else e.z=b.maxZ+e.r;
    }
  }
}
function step(e,dx,dz){e.x+=dx;resolve(e);e.z+=dz;resolve(e);e.x=Math.max(-38.6,Math.min(38.6,e.x));e.z=Math.max(-38.6,Math.min(38.6,e.z));}
function ladderAt(p){for(const L of ladders)if(Math.abs(p.x-L.x)<1&&Math.abs(p.z-L.z)<1.1)return L;return null;}
function floorY(e){
  let g=0;
  for(const b of boxes)if(e.y>=b.h-.05&&e.x>b.minX-e.r*.5&&e.x<b.maxX+e.r*.5&&e.z>b.minZ-e.r*.5&&e.z<b.maxZ+e.r*.5)g=Math.max(g,b.h);
  return g;
}

function openParty(){
  if(!window.Peer){note('PeerJS failed to load, so the party is offline');return;}
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<5;i++)code+=A[Math.random()*A.length|0];
  const p=new Peer('rvb-'+code);net.peer=p;
  p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();openParty();}else note('Party error: '+e.type);});
  p.on('open',()=>{net.host=true;net.on=true;$('party').textContent='Party code: '+code+' (share it with friends)';$('party').classList.remove('hide');});
  p.on('connection',c=>{net.conns.push(c);c.on('data',m=>onHost(c,m));

let ac;
function snd(f,d,v,type){
  if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(40,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
}

let nbuf;
function shot(v){
  if(!ac)return;
  const t=ac.currentTime;
  if(!nbuf){nbuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.25),ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  n.buffer=nbuf;f.type='lowpass';f.frequency.setValueAtTime(4000,t);f.frequency.exponentialRampToValueAtTime(400,t+.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
  n.connect(f);f.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+.15);
  snd(150,.1,v*.6,'sine');
}

function makeBot(team){ // slim faceless faceted humanoid with jointed limbs
  const g=new THREE.Group();g.rotation.order='YXZ';
  const body=new THREE.MeshPhongMaterial({color:team==='red'?0xe6e0c8:0x6f9a4a,flatShading:true,shininess:18,specular:0x333340}),
    dark=new THREE.MeshPhongMaterial({color:0x22262e,flatShading:true,shininess:60});
  const mk=(geo,mat,x,y,z,par)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;(par||g).add(m);return m;};
  const cyl=(a,b,h,n)=>new THREE.CylinderGeometry(a,b,h,n||6),J=(par,x,y,z)=>{const j=new THREE.Group();j.position.set(x,y,z);par.add(j);return j;};
  mk(cyl(.15,.17,.24),body,0,.86,0).scale.z=.75;                                    // hips
  const ub=J(g,0,.95,0);                                                              // upper body pivots at the waist
  mk(cyl(.27,.18,.58),body,0,.32,0,ub).scale.z=.6;mk(cyl(.055,.065,.13,5),body,0,.6,0,ub);
  const hd=mk(new THREE.IcosahedronGeometry(.2,0),body,0,.8,0,ub);hd.scale.set(.95,1.22,1.05);
  const arm=x=>{const sh=J(ub,x,.5,0),el=J(sh,0,-.34,0);
    mk(cyl(.065,.05,.34,5),body,0,-.17,0,sh);mk(cyl(.05,.04,.32,5),body,0,-.16,0,el);mk(new THREE.IcosahedronGeometry(.06,0),body,0,-.34,0,el);return {s:sh,e:el};};
  const la=arm(-.34),ra=arm(.34);
  mk(new THREE.BoxGeometry(.05,.13,.08),dark,0,-.4,.02,ra.e);mk(new THREE.BoxGeometry(.04,.05,.2),dark,0,-.46,-.08,ra.e); // pistol
  const leg=x=>{const h=J(g,x,.82,0),k=J(h,0,-.42,0);
    mk(cyl(.088,.065,.42),body,0,-.21,0,h);mk(cyl(.065,.05,.4),body,0,-.2,0,k);mk(new THREE.BoxGeometry(.11,.07,.25),dark,0,-.42,-.05,k);return {h,k};};
  const eye=new THREE.MeshBasicMaterial({color:team==='red'?0x0a0a0a:0xff3b2e});

function sync(e){

  if(e.group){e.group.position.set(e.x,e.alive?e.y:.25,e.z);e.group.rotation.y=e.yaw;
    const mv=Math.hypot(e.x-(e.lx===undefined?e.x:e.lx),e.z-(e.lz===undefined?e.z:e.lz)),mov=e.alive&&mv>.002&&mv<1;e.lx=e.x;e.lz=e.z;
    const r=mov?Math.max(0,Math.min(1,(mv/Math.max(fdt,.001)-1.5)/4)):0; // 0 = walk, 1 = full sprint
    e.ph=(e.ph||0)+(mov?mv*3.3:0);e.amp=(e.amp||0)+((mov?1:0)-(e.amp||0))*.15;e.run=(e.run||0)+(r-(e.run||0))*.12;e.aimB=(e.aimB||0)+((e.aimT>0&&e.alive?1:0)-(e.aimB||0))*.2;

    u.ra.s.rotation.x=(1-aim)*((sp*sw-idle)*sa+.95*cr)+aim*1.3;u.ra.e.rotation.x=(1-aim)*(eb*(1-cr)+1.2*cr)+aim*.15;
    u.ub.rotation.y=sp*(.1+.12*R)*A*(1-aim*.7);u.ub.rotation.x=(-.04-.2*R)*A;u.ub.rotation.z=Math.cos(p)*.03*A;u.ub.scale.y=1+Math.sin(performance.now()/450+e.x)*.01*(1-A);

// Goal for a CTF bot, or null to patrol near its own flag (defenders only)
function ctfGoal(b){
  const own=flags[b.team],en=flags[b.team==='red'?'blue':'red'];
  if(en.carrier===b)return own.home;
  if(b.role==='def'){
    if(own.carrier)return own.carrier;
    if(!own.atHome)return own;
    return null;
  }
  return en.carrier||en;
}
function patrol(b){
  const h=flags[b.team].home,dir=b.team==='red'?-1:1;
  return {x:h.x+(Math.random()-.5)*24,z:h.z+dir*Math.random()*14};
}
function updateFlags(dt){
  for(const t of ['red','blue']){
    const f=flags[t],c=f.carrier;
    if(c){f.x=c.x;f.z=c.z;f.y=c.y;}
    else if(!net.cl&&!f.atHome&&(f.timer-=dt)<=0)returnFlag(f);
    f.mesh.position.set(f.x+(c?Math.sin(c.yaw)*.6:0),f.y,f.z+(c?Math.cos(c.yaw)*.6:0));
    f.beam.visible=c!==player;
  }
  for(const e of net.cl?[]:ents){
    if(!e.alive)continue;
    for(const t of ['red','blue']){
      const f=flags[t];
      if(f.carrier||Math.hypot(e.x-f.x,e.z-f.z)>1.5||Math.abs(e.y-f.y)>1.6)continue;
      if(e.team===t){if(!f.atHome)returnFlag(f);}
      else{f.carrier=e;f.atHome=false;note(tag(e)+' took the '+ftag(t));}
    }
    const o=e.team==='red'?'blue':'red';
    if(flags[o].carrier===e&&inOwnZone(e)){ // just reach your base
      e.caps++;score[e.team]++;showScore();
      note(tag(e)+' captured the '+ftag(o));
      returnFlag(flags[o],true);
      if(score[e.team]>=CAP_WIN)end(e.team);
    }
  }
  const p=player,own=flags[myTeam],en=flags[myTeam==='red'?'blue':'red'];
  $('carry').textContent=!p.alive?'':
    en.carrier===p?'You have the '+NAME[en.team]+' flag. Get into your base to capture it.':
    own.carrier?'Your flag was stolen. Take down the carrier.':
    !own.atHome?'Your flag is on the ground. Touch it to return it.':
    en.carrier?'Your team has the flag. Cover the carrier.':
    'Capture the '+NAME[en.team]+' flag.';
}

// ---- Player ----
function playerUpdate(dt){
  const p=player;
  if(!p.alive){
    p.respawn-=dt;$('dead').textContent='Eliminated. Respawning in '+Math.max(1,Math.ceil(p.respawn));
    if(p.respawn<=0){spawn(p);if(net.cl){net.ng=.8;nsend({t:'resp'});}}return;
  }
  const s=Math.sin(p.yaw),c=Math.cos(p.yaw);
  const mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  p.crouching=!!(keys.ControlLeft||keys.ControlRight||keys.KeyC);
  p.sprint=!p.crouching&&!scoped&&mz>0&&!!(keys.ShiftLeft||keys.ShiftRight);
  p.k+=((p.slide>0?.5:p.crouching?.62:1)-p.k)*Math.min(1,dt*14);
  p.moving=!!(mx||mz);
  if(p.mount>0){p.mount-=dt;p.vy=0;step(p,p.mdx*4*dt,p.mdz*4*dt);} // stepping off the ladder onto the roof
  else if(p.lad){
    const L=p.lad;p.vy=0;p.ground=false;
    if(keys.Space){p.lad=null;p.vy=4;step(p,-L.dx*.6,-L.dz*.6);}
    else{
      p.y+=((keys.KeyW?1:0)-(keys.KeyS?1:0))*3.2*dt;
      const k=Math.min(1,dt*10);p.x+=(L.x-p.x)*k;p.z+=(L.z-p.z)*k;
      if(p.y<=0){p.y=0;p.lad=null;}

    }
  }else{
    // BO3-style: momentum, sprint-slide (crouch while sprinting), slide-hop and a thrust jump (tap jump again in the air)
    const crE=p.crouching&&!p.crW;p.crW=p.crouching;
    if(crE&&p.wasSpr&&p.ground&&!(p.slide>0)){const v=Math.hypot(p.vx,p.vz);if(v>5){p.slide=.9;p.svel=Math.max(v*1.25,10.5);p.sdx=p.vx/v;p.sdz=p.vz/v;}}
    p.wasSpr=p.sprint;
    const want=(p.sprint?9.5:p.crouching?3.2:6.5)*(myClass==='behemoth'?.5:1);let tx=0,tz=0;
    if(p.moving){const l=Math.hypot(mx,mz);tx=(c*mx-s*mz)/l*want;tz=(-s*mx-c*mz)/l*want;}
    if(p.slide>0){p.slide-=dt;p.svel=Math.max(0,p.svel-12*dt);p.vx=p.sdx*p.svel;p.vz=p.sdz*p.svel;if(p.slide<=0||p.svel<2.5)p.slide=0;}

    step(p,p.vx*dt,p.vz*dt);
    const spc=!!keys.Space,jE=spc&&!p.spW;p.spW=spc;
    if(spc&&p.ground&&(!p.crouching||p.slide>0)){p.vy=9;p.slide=0;}
    else if(jE&&!p.ground&&p.boost>0&&!p.crouching){p.boost=0;p.vy=8.5;p.vx+=tx*.5;p.vz+=tz*.5;snd(220,.12,.05,'sine');}
    p.vy-=24*dt;p.y+=p.vy*dt;
    const g=floorY(p);
    if(p.y<=g){p.y=g;p.vy=0;p.ground=true;p.boost=1;}else p.ground=false;
    if(keys.KeyW&&p.y<1){const L=ladderAt(p);if(L&&-s*L.dx-c*L.dz>.35){p.lad=L;p.vx=p.vz=0;}}
  }
  fireT-=dt;
  if(p.inZone||p.sprint||(W().sniper&&fireT>0))trigger=false;
  spin=W().mini&&mouseDown&&!p.inZone&&reload<=0?Math.min(1,spin+dt*1.6):Math.max(0,spin-dt*2.5); // minigun spin-up
  healing=false;

  else if(keys.KeyR&&ammo<W().mag)reload=W().reload;
  else if((trigger||(W().auto&&mouseDown))&&fireT<=0&&!p.inZone&&!p.sprint&&(!W().mini||spin>=1)){
    if(ammo<=0){reload=W().reload;trigger=false;}
    else{
      ammo--;fireT=W().rate;trigger=false;kick=1;
      const sp=(.004+(p.moving?.012:0)+(p.ground?0:.02))*(p.crouching?.6:1)*(p.sprint?1.5:1)*W().spread*(scoped?.3:1),cp=Math.cos(pitch),r=()=>(Math.random()-.5)*2*sp;

      if(W().rocket){launchRocket(p,o,d);if(net.on){const m={t:'rk',s:ents.indexOf(p),o:A3(o),d:A3(d)};if(net.cl)nsend(m);else bc(m);}}else fire(p,o,d,W().dmg,W().head);
    }

// ---- Bots ----
const baseSide=(x,z)=>Math.abs(x)<20.6&&Math.abs(z)>28.4?Math.sign(z):0;
function route(b,g){ // steer bots through the base gates (x = +-10)
  const bs=baseSide(b.x,b.z),gs=baseSide(g.x,g.z);
  if(bs===gs)return g;
  const s=bs||gs,gx=Math.abs(b.x+10)<Math.abs(b.x-10)?-10:10;
  if(bs)return Math.abs(b.x-gx)>1.5&&s*b.z>30?{x:gx,z:s*31}:{x:gx,z:s*24};
  return Math.abs(b.x-gx)>2?{x:gx,z:s*24}:{x:gx,z:s*31};
}
function bot(b,dt){
  if(!b.alive){b.respawn-=dt;if(b.respawn<=0)spawn(b);return;}
  b.think-=dt;
  if(b.think<=0){
    b.think=.25+Math.random()*.25;
    let best=null,bd=55;
    for(const e of ents){
      if(!e.alive||e.team===b.team||invuln(e)||e.invis>0)continue;
      const d=Math.hypot(e.x-b.x,e.z-b.z);
      if(d<bd&&see(b,e)){best=e;bd=d;}
    }
    if(best&&!b.target)b.cd=Math.max(b.cd,.45);
    const carrying=mode==='ctf'&&flags[b.team==='red'?'blue':'red'].carrier===b;
    b.target=carrying?null:best;
    if(Math.random()<.35)b.strafe*=-1;
    if(mode==='ctf'){
      const g=ctfGoal(b);
      if(g)b.goal=g;else if(!b.goal||Math.hypot(b.goal.x-b.x,b.goal.z-b.z)<3)b.goal=patrol(b);
    }else if(!best&&(!b.goal||Math.hypot(b.goal.x-b.x,b.goal.z-b.z)<3))
      b.goal={x:(Math.random()-.5)*70,z:Math.random()<.6?(b.team==='red'?-1:1)*Math.random()*36:(Math.random()-.5)*70};
    if(b.hp<60&&!best&&!carrying){const k=nearestKit(b);if(k)b.goal=k;}
  }
  const t=b.target,tv=t&&t.alive&&!invuln(t)&&!(t.invis>0);
  let dx=0,dz=0;
  if(tv){
    const ex=t.x-b.x,ez=t.z-b.z,d=Math.hypot(ex,ez)||1,nx=ex/d,nz=ez/d,adv=d>14?1:d<7?-1:0;
    b.yaw=Math.atan2(-ex,-ez);

  }else if(b.goal){const w=route(b,b.goal);dx=w.x-b.x;dz=w.z-b.z;}
  if(b.avoid>0){b.avoid-=dt;const c=Math.cos(b.avAng),s=Math.sin(b.avAng);[dx,dz]=[dx*c-dz*s,dx*s+dz*c];}
  const l=Math.hypot(dx,dz);
  if(l>.01){
    const sp=BOT_SPEED*dt;dx=dx/l*sp;dz=dz/l*sp;
    if(!tv)b.yaw=Math.atan2(-dx,-dz);
    const ox=b.x,oz=b.z;step(b,dx,dz);
    if(Math.hypot(b.x-ox,b.z-oz)<sp*.4){
      b.stuck+=dt;
      if(b.stuck>.3){b.stuck=0;b.avoid=.9;b.avAng=(Math.random()<.5?-1:1)*(1.2+Math.random());b.goal=null;}
    }else b.stuck=0;
  }
  b.cd-=dt;b.aimT=tv?.5:(b.aimT||0)-dt;
  if(tv&&b.cd<=0&&!b.inZone){
    b.cd=.4+Math.random()*.4;
    const o=new THREE.Vector3(b.x,b.y+EYE,b.z),d=new THREE.Vector3(t.x,t.y+1.2*t.k,t.z).sub(o),dist=d.length(),sp=.035+dist*.0015;
    d.normalize();d.x+=(Math.random()-.5)*2*sp;d.y+=(Math.random()-.5)*2*sp;d.z+=(Math.random()-.5)*2*sp;d.normalize();
    fire(b,o,d.clone(),BOT_DMG);
  }
  sync(b);
}

  gun.position.y=-.2+.07*adsK-(reload>0?.12:0)-lower*.2-gSpr*.1-Math.abs(Math.sin(wob*.5))*.015*bb*(1-adsK)+swY*.4;
  gun.position.z=-.5+kick*sd.kz;
  gun.rotation.x=kick*sd.kr+lower*.5+gSpr*.15+swY*.8;gun.rotation.y=gSpr*.65+swX*1.2;gun.rotation.z=-gSpr*.25+Math.sin(wob*.5)*.015*bb; // sprint pose: gun angled across the body
  const p=player;
  $('hp').style.width=Math.max(0,p.hp)+'%';$('hp').style.background=p.hp>35?'#4ade80':'#f87171';
  $('hpn').textContent=Math.max(0,Math.ceil(p.hp));
  $('am').textContent=W().beam?'∞':reload>0?'...':ammo;
  $('abil').textContent=myClass==='medic'?(p.uber>0?'ÜberCharge '+p.uber.toFixed(1)+'s':uberCh>=100?'ÜberCharge ready [E]':'ÜberCharge '+Math.floor(uberCh)+'%'):myClass==='sniper'?(fireT>0&&reload<=0?'Chambering '+fireT.toFixed(1)+'s':'Hold right-click to scope'):myClass==='stealth'?(stealthT>0?'Invisible '+stealthT.toFixed(1)+'s':stealthCd>0?'Cloak recharging '+Math.ceil(stealthCd)+'s':hasFlag(p)?'Cloak offline: carrying flag':'Cloak ready [E]'):'';
  $('kd').textContent=p.kills+' kills, '+p.deaths+' deaths';
  if(!p.alive)scoped=false;
  $('hint').textContent=p.lad?'W / S to climb, Space to let go':p.alive&&p.y<1&&ladderAt(p)?'Face the ladder and hold W to climb':'';
  $('safe').textContent=!p.alive?'':p.inZone?'Safe zone: invincible, weapons offline':p.grace>0?'Invincible for '+p.grace.toFixed(1)+'s':'';
  $('vig').style.opacity=dmgFlash;$('hm').style.opacity=hm>0?1:0;
}
let fdt=.016,last=performance.now(),orbit=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;fdt=dt;
  if(state==='play'&&(locked||net.on))update(dt); // online: the match keeps running while you are on the pause screen
  if(player){
    const sv=Math.hypot(player.vx||0,player.vz||0),gd=player.ground&&player.alive&&locked;bobPh+=gd?sv*dt*1.5:0;
    const bob=gd?Math.sin(bobPh*2)*.03*Math.min(1,sv/8):0,swy=gd?Math.cos(bobPh)*.012*Math.min(1,sv/8):0;
    camRoll+=((((keys.KeyA?1:0)-(keys.KeyD?1:0))*.025+(player.slide>0?-.05:0))-camRoll)*Math.min(1,dt*8);
    camera.position.set(player.x,player.y+(player.alive?EYE*player.k:.4)+bob,player.z);camera.rotation.set(pitch,player.yaw,camRoll+swy);
    const tf=scoped&&player.alive?(myClass==='sniper'?18:58):player.slide>0?92:player.sprint&&player.alive&&locked?86:75;$('scope').style.display=scoped&&player.alive&&myClass==='sniper'?'block':'none';
    if(Math.abs(camera.fov-tf)>.05){camera.fov+=(tf-camera.fov)*Math.min(1,dt*8);camera.updateProjectionMatrix();}
  }
  else{orbit+=dt*.15;camera.position.set(Math.sin(orbit)*42,17,Math.cos(orbit)*42);camera.lookAt(0,0,0);}
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

// ---- Input ----
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.code==='Tab'){e.preventDefault();if(state==='play'&&locked){tabOn=true;$('lb2').innerHTML=tabHtml();$('tab').classList.remove('hide');}return;}keys[e.code]=true;if(e.code==='KeyQ'&&!e.repeat)switchWeapon();if(e.code==='KeyE'&&!e.repeat)cloak();if(e.code==='Space'||(e.ctrlKey&&state==='play'))e.preventDefault();});
// Browsers can't block Ctrl+W (crouch + forward), so ask before the tab closes mid-match
addEventListener('beforeunload',e=>{if(state==='play'){e.preventDefault();e.returnValue='';}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Tab'){tabOn=false;$('tab').classList.add('hide');}});
addEventListener('mousedown',e=>{if(e.button===0){mouseDown=true;trigger=true;}if(e.button===2&&locked)scoped=true;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mouseup',e=>{if(e.button===0){mouseDown=false;trigger=false;}if(e.button===2)scoped=false;});
addEventListener('mousemove',e=>{
  if(!locked||!player)return;
  const k=.0022*(scoped?(myClass==='sniper'?.3:.65):1);swX=Math.max(-.06,Math.min(.06,swX-e.movementX*.0003));swY=Math.max(-.06,Math.min(.06,swY+e.movementY*.0003));player.yaw-=e.movementX*k;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*k));
});
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===renderer.domElement;
  if(!locked){tabOn=false;$('tab').classList.add('hide');mouseDown=trigger=scoped=false;for(const k in keys)keys[k]=false;}
  $('pause').classList.toggle('hide',locked||state!=='play');if(!locked&&state==='play')buildPause();
});
document.addEventListener('pointerlockerror',()=>{if(state==='play')$('pause').classList.remove('hide');});
$('pause').addEventListener('click',()=>renderer.domElement.requestPointerLock());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
